name: Build Portable Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install UPX Compressor
        run: choco install upx --no-progress

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials Pillow numpy pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Build Lightweight Portable EXE
        run: |
          python build_exe.py

      - name: Create Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Gunita.exe" -DestinationPath "dist/Gunita-Windows-x64-portable.zip" -Force
          Get-Item dist/* | Select-Object Name, Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gunita-Windows-x64-portable
          path: |
            dist/Gunita.exe
            dist/Gunita-Windows-x64-portable.zip
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Gunita.exe
            dist/Gunita-Windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

